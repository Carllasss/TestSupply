services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: suppliers
      POSTGRES_PASSWORD: suppliers
      POSTGRES_DB: suppliers
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suppliers"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant_data:/qdrant/storage

  # OpenAI's API blocks Russian IPs; this sidecar tunnels just the backend's
  # OpenAI traffic out through a Shadowsocks proxy. Only used when
  # SHADOWSOCKS_SERVER (root .env, gitignored) is set.
  shadowsocks:
    image: ghcr.io/shadowsocks/ssrust:latest
    command: >
      sslocal --local-addr 0.0.0.0:1080 --local-protocol socks
      --server-addr ${SHADOWSOCKS_SERVER:-127.0.0.1:0}
      --encrypt-method ${SHADOWSOCKS_METHOD:-none}
      --password ${SHADOWSOCKS_PASSWORD:-unset}
    restart: unless-stopped

  backend:
    build: ./catalog/backend
    env_file:
      - ./catalog/backend/.env
    environment:
      DATABASE_URL: postgresql://suppliers:suppliers@postgres:5432/suppliers
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OPENAI_PROXY_URL: socks5://shadowsocks:1080
    volumes:
      - fastembed_cache:/root/.cache/fastembed_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      shadowsocks:
        condition: service_started

  frontend:
    build:
      context: ./catalog/frontend
      args:
        VITE_BASE_PATH: /catalog/
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

  landing:
    build: ./landing
    ports:
      - "127.0.0.1:8081:80"

volumes:
  postgres_data:
  qdrant_data:
  fastembed_cache:
