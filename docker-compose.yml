services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: suppliers
      POSTGRES_PASSWORD: suppliers
      POSTGRES_DB: suppliers
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suppliers"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./catalog/backend
    env_file:
      - ./catalog/backend/.env
    environment:
      DATABASE_URL: postgresql://suppliers:suppliers@postgres:5432/suppliers
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    volumes:
      - fastembed_cache:/root/.cache/fastembed_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    build: ./catalog/frontend
    depends_on:
      - backend

  landing:
    build: ./landing

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "8080:8080"
    depends_on:
      - landing
      - frontend

volumes:
  postgres_data:
  qdrant_data:
  fastembed_cache:
