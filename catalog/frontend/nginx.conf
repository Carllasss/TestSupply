server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        # Preserve the real client IP set by an upstream reverse proxy (e.g. host
        # nginx) instead of overwriting it with this hop's own address.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE endpoints (web-search/stream) need events flushed immediately,
        # not buffered until the response ends.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Hashed build assets (filename changes on content change) are safe to
    # cache hard, both at the root mount and under the /catalog/ prefix.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /catalog/assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Same build served under a /catalog/ prefix too, for deployments where a
    # host-level reverse proxy mounts this app at that path (base set via
    # VITE_BASE_PATH at build time).
    location /catalog/ {
        alias /usr/share/nginx/html/;
        # index.html isn't hashed, so without this it can get stuck in the
        # browser's heuristic cache pointing at an old JS/CSS bundle after a
        # deploy.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /catalog/index.html;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
