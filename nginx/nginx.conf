# Единая точка входа для обоих сайтов на одном сервере.
# Порт 80   -> лендинг-резюме (корень).
# Порт 8080 -> каталог поставщиков (фронт сам проксирует /api на бэкенд, см.
#              catalog/frontend/nginx.conf).
#
# Когда появится домен, замени "listen 80/8080" на server_name-блоки
# (например landing.example.com и catalog.example.com) на порту 80/443 —
# сама логика проксирования не изменится.

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://landing:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 8080;
    server_name _;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
